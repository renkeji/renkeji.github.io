<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Georgia,'Times New Roman',serif">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#666"/></marker></defs>
  <rect x=".5" y=".5" width="919" height="429" rx="10" fill="#fff" stroke="#e2e2e2"/>
  <text x="460" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c3a5e">How a billion-parameter retriever becomes interactive</text>
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#777">Remove LLM inference from the hot path, then optimize the asynchronous serving path</text>

  <text x="35" y="93" font-size="13" font-weight="bold" fill="#333">User-facing hot path</text>
  <rect x="35" y="108" width="160" height="58" rx="7" fill="#fdf6e3" stroke="#c9a227"/>
  <text x="115" y="133" text-anchor="middle" font-size="13" fill="#6b4f10">CTV request</text>
  <text x="115" y="151" text-anchor="middle" font-size="11" fill="#777">must return in ~100 ms</text>
  <path d="M197 137 L267 137" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="275" y="108" width="160" height="58" rx="7" fill="#e8f0e4" stroke="#5b8c4a"/>
  <text x="355" y="133" text-anchor="middle" font-size="13" fill="#2d4a24">Read cached layout</text>
  <text x="355" y="151" text-anchor="middle" font-size="11" fill="#777">no online LLM inference</text>
  <path d="M437 137 L507 137" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="515" y="108" width="180" height="58" rx="7" fill="#e7f1fa" stroke="#6aa3d5"/>
  <text x="605" y="133" text-anchor="middle" font-size="13" fill="#1c3a5e">Render homepage</text>
  <text x="605" y="151" text-anchor="middle" font-size="11" fill="#777">topics + ranked videos</text>

  <path d="M355 168 C355 210 735 185 735 225" fill="none" stroke="#7a5ba6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="545" y="202" text-anchor="middle" font-size="11" fill="#7a5ba6">after responding, refresh asynchronously</text>

  <text x="35" y="238" font-size="13" font-weight="bold" fill="#333">Asynchronous refill path</text>
  <rect x="35" y="252" width="195" height="68" rx="7" fill="#f2ecf7" stroke="#7a5ba6"/>
  <text x="132" y="278" text-anchor="middle" font-size="13" fill="#4a326b">LLM token generation</text>
  <text x="132" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33">~500 ms uncached</text>
  <path d="M232 286 L292 286" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="252" width="195" height="68" rx="7" fill="#e7f1fa" stroke="#6aa3d5"/>
  <text x="397" y="278" text-anchor="middle" font-size="13" fill="#1c3a5e">SID prefix lookup</text>
  <text x="397" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33">~150 ms uncached</text>
  <path d="M497 286 L557 286" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="565" y="252" width="195" height="68" rx="7" fill="#e8f0e4" stroke="#5b8c4a"/>
  <text x="662" y="278" text-anchor="middle" font-size="13" fill="#2d4a24">Update component caches</text>
  <text x="662" y="299" text-anchor="middle" font-size="11" fill="#777">independent freshness windows</text>

  <rect x="35" y="350" width="850" height="48" rx="8" fill="#f4f4f4" stroke="#bbb"/>
  <text x="460" y="371" text-anchor="middle" font-size="13" fill="#333">Serving optimization: 2 QPS → ~40 QPS → 80 QPS → 200 QPS per A100</text>
  <text x="460" y="389" text-anchor="middle" font-size="11" fill="#666">concurrency → remove CPU duplication → distribute beam-search orchestration</text>
  <text x="460" y="419" text-anchor="middle" font-size="11" font-style="italic" fill="#777">Diagram created for this blog, based on Sections 3.7 and 4.1 of the paper.</text>
</svg>
