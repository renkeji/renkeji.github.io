<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Georgia,'Times New Roman',serif">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#666"/></marker></defs>
  <rect x=".5" y=".5" width="919" height="519" rx="10" fill="#fff" stroke="#e2e2e2"/>
  <text x="460" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c3a5e">LLM-powered agentic recommendation for Connected TV</text>
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#777">LLMs reason at the topic level; specialized ML retrieves and ranks media</text>

  <rect x="45" y="90" width="830" height="72" rx="8" fill="#fdf6e3" stroke="#c9a227"/>
  <text x="460" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4f10">Unified natural-language context</text>
  <text x="460" y="139" text-anchor="middle" font-size="12" fill="#555">interests · searches · session activity · location · time · trends · seasonal events</text>

  <path d="M460 164 L460 194" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="45" y="205" width="240" height="150" rx="9" fill="#f2ecf7" stroke="#7a5ba6" stroke-width="1.4"/>
  <text x="165" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a326b">1. Topic retrieval agent</text>
  <text x="165" y="254" text-anchor="middle" font-size="12" fill="#4a326b">Llama-3 70B</text>
  <line x1="65" y1="269" x2="265" y2="269" stroke="#b8a5cc"/>
  <text x="65" y="292" font-size="12" fill="#444">• generates timely topic names</text>
  <text x="65" y="313" font-size="12" fill="#444">• reasons over heterogeneous context</text>
  <text x="65" y="334" font-size="12" fill="#444">• blocklist + risk classifier</text>

  <path d="M287 280 L332 280" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="340" y="190" width="240" height="180" rx="9" fill="#e7f1fa" stroke="#6aa3d5" stroke-width="1.4"/>
  <text x="460" y="217" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c3a5e">2. Media retrieval + ranking</text>
  <text x="460" y="239" text-anchor="middle" font-size="12" fill="#1c3a5e">hybrid LLM + traditional recommender</text>
  <line x1="360" y1="254" x2="560" y2="254" stroke="#9fc3df"/>
  <text x="360" y="277" font-size="12" fill="#444">• MediaBrain: topic → Semantic IDs</text>
  <text x="360" y="298" font-size="12" fill="#444">• prefix lookup → video candidates</text>
  <text x="360" y="319" font-size="12" fill="#444">• early-stage lightweight ranker</text>
  <text x="360" y="340" font-size="12" fill="#444">• late-stage behavioral ranker</text>

  <path d="M582 280 L627 280" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="635" y="205" width="240" height="150" rx="9" fill="#e8f0e4" stroke="#5b8c4a" stroke-width="1.4"/>
  <text x="755" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d4a24">3. Topic ranking agent</text>
  <text x="755" y="254" text-anchor="middle" font-size="12" fill="#2d4a24">orders complete topic + media slates</text>
  <line x1="655" y1="269" x2="855" y2="269" stroke="#9dbb91"/>
  <text x="655" y="292" font-size="12" fill="#444">• user affinity</text>
  <text x="655" y="313" font-size="12" fill="#444">• diversity and freshness</text>
  <text x="655" y="334" font-size="12" fill="#444">• media quality indicators</text>

  <path d="M460 372 L460 402" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="150" y="412" width="620" height="66" rx="9" fill="#f4f4f4" stroke="#bbb"/>
  <text x="460" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Personalized CTV homepage</text>
  <text x="460" y="460" text-anchor="middle" font-size="12" fill="#555">multiple coherent topic channels, each containing ranked videos</text>
  <text x="460" y="503" text-anchor="middle" font-size="11" font-style="italic" fill="#777">Diagram created for this blog, based on Figure 1 and Sections 3.1–3.4 of the paper.</text>
</svg>
